<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  </head>
  <body>
    <div id="qrcode-container" style="display: none"></div>
    <canvas id="card-canvas" style="display: none"></canvas>
    <script>
      window["ai_edge_gallery_get_result"] = async function (data, secret) {
        console.log("[learn-something-new-pl] Start skryptu:", data);
        try {
          if (document.fonts && document.fonts.ready) {
            await document.fonts.ready;
          }

          let params = {};
          if (typeof data === "object" && data !== null) {
            params = data;
          } else if (typeof data === "string") {
            const cleanData = data.trim();
            try {
              params = JSON.parse(cleanData);
            } catch (e) {
              try {
                params = JSON.parse(cleanData + "}");
              } catch (e2) {
                try {
                  params = JSON.parse(cleanData + '"}');
                } catch (e3) {
                  const topicMatch = cleanData.match(/"topic"\s*:\s*"([^"\\]*(?:\\.[^"\\]*)*)/i);
                  const descMatch = cleanData.match(
                    /"description"\s*:\s*"([^"\\]*(?:\\.[^"\\]*)*)/i,
                  );
                  params.topic = topicMatch ? topicMatch[1].replace(/\\"/g, '"') : "Niepełne dane";
                  params.description = descMatch
                    ? descMatch[1].replace(/\\"/g, '"')
                    : "Nie udało się odczytać pełnego opisu.";
                }
              }
            }
          }

          const topic = params.topic || "Nieznany temat";
          const description = params.description || "";

          const canvas = document.getElementById("card-canvas");
          const ctx = canvas.getContext("2d");

          canvas.width = 1080;
          canvas.height = 1080;

          const gradient = ctx.createLinearGradient(0, 0, 1080, 1080);
          gradient.addColorStop(0, "#FF9A9E");
          gradient.addColorStop(0.5, "#FECFEF");
          gradient.addColorStop(1, "#A1C4FD");
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, 1080, 1080);

          ctx.shadowColor = "rgba(0, 0, 0, 0.15)";
          ctx.shadowBlur = 40;
          ctx.shadowOffsetY = 20;
          ctx.fillStyle = "#FFFFFF";

          const x = 60, y = 60, w = 960, h = 960, r = 40;
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
          ctx.fill();
          ctx.shadowColor = "transparent";

          ctx.fillStyle = "#FF6B6B";
          ctx.font = 'bold 32px "Google Sans", sans-serif';
          ctx.fillText("💡 DZIŚ POZNAJĘ", 120, 150);

          ctx.fillStyle = "#2D3436";
          ctx.font = 'bold 72px "Google Sans", sans-serif';
          const topicY = 250;
          const nextYAfterTopic = wrapText(ctx, topic, 120, topicY, 840, 85);

          let clampedDescription = description;
          if (clampedDescription.length > 320) {
            let cutIndex = -1;
            for (let i = 319; i >= 0; i--) {
              if (
                clampedDescription[i] === "." ||
                clampedDescription[i] === "!" ||
                clampedDescription[i] === "?"
              ) {
                cutIndex = i + 1;
                break;
              }
            }
            if (cutIndex > 0) {
              clampedDescription = clampedDescription.substring(0, cutIndex).trim();
            } else {
              clampedDescription = clampedDescription.substring(0, 317) + "...";
            }
          }

          ctx.fillStyle = "#636E72";
          ctx.font = '42px "Google Sans", sans-serif';
          wrapText(ctx, clampedDescription, 120, nextYAfterTopic + 90, 840, 60);

          function getPlatform() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) return "iOS";
            if (/android/i.test(userAgent)) return "Android";
            return "unknown";
          }

          const platform = getPlatform();
          let linkUrl = "https://github.com/google-ai-edge/gallery";
          if (platform === "iOS") {
            linkUrl = "https://apps.apple.com/us/app/google-ai-edge-gallery/id6749645337";
          } else if (platform === "Android") {
            linkUrl = "https://play.google.com/store/apps/details?id=com.google.ai.edge.gallery";
          }

          const container = document.getElementById("qrcode-container");
          container.innerHTML = "";
          try {
            new QRCode(container, {
              text: linkUrl,
              width: 140,
              height: 140,
              colorDark: "#2D3436",
              colorLight: "#ffffff",
              correctLevel: QRCode.CorrectLevel.L,
            });
          } catch (qrInitErr) {
            console.error("[learn-something-new-pl] Błąd generowania QR:", qrInitErr);
          }

          const qrCanvas = await new Promise((resolve) => {
            let attempts = 0;
            const check = setInterval(() => {
              const canvas = container.querySelector("canvas");
              if (canvas) {
                clearInterval(check);
                resolve(canvas);
              }
              if (attempts++ > 20) {
                clearInterval(check);
                console.warn("[learn-something-new-pl] QR nie został wygenerowany.");
                resolve(null);
              }
            }, 50);
          });

          const footerY = 920;
          if (qrCanvas) {
            ctx.drawImage(qrCanvas, 830, 820, 140, 140);
          }

          const logoImg = new Image();
          logoImg.src = "../assets/galleryLogo.svg";

          await new Promise((resolve) => {
            logoImg.onload = () => {
              ctx.drawImage(logoImg, 115, footerY - 30, 70, 70);
              resolve();
            };
            logoImg.onerror = () => resolve();
          });

          ctx.fillStyle = "#2D3436";
          ctx.font = 'bold 36px "Google Sans", sans-serif';
          ctx.fillText("Google AI Edge Gallery", 200, footerY);
          ctx.fillStyle = "#B2BEC3";
          ctx.font = '28px "Google Sans", sans-serif';
          ctx.fillText("Zeskanuj, aby pobrać aplikację", 200, footerY + 40);

          const finalBase64 = canvas.toDataURL("image/jpeg", 0.9);

          return JSON.stringify({
            result: JSON.stringify({
              status: "success",
              message: "Karta została wygenerowana.",
            }),
            image: { base64: finalBase64 },
            error: null,
          });
        } catch (err) {
          return JSON.stringify({ result: null, image: null, error: err.message });
        }
      };

      function wrapText(context, text, x, y, maxWidth, lineHeight) {
        const words = text.split(" ");
        let line = "";
        let currentY = y;

        for (let n = 0; n < words.length; n++) {
          const testLine = line + words[n] + " ";
          const metrics = context.measureText(testLine);
          const testWidth = metrics.width;

          if (testWidth > maxWidth && n > 0) {
            context.fillText(line, x, currentY);
            line = words[n] + " ";
            currentY += lineHeight;
          } else {
            line = testLine;
          }
        }

        context.fillText(line, x, currentY);
        return currentY;
      }
    </script>
  </body>
</html>
