<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div id="qrcode-container" style="display:none"></div>
  <canvas id="card-canvas" style="display:none"></canvas>

<script>
window["ai_edge_gallery_get_result"] = async function(data) {
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;

    let params = {};
    try {
      params = typeof data === "string" ? JSON.parse(data) : (data || {});
    } catch (_) {}

    const requestedTopic = (params.topic || "").trim();
    if (!requestedTopic) throw new Error("Brak tematu.");

    // Jedno wywołanie: wyszukaj temat bezpośrednio w polskiej Wikipedii.
    const baseUrl = "https://pl.wikipedia.org/w/api.php";
    const searchParams = new URLSearchParams({
      action: "query",
      format: "json",
      generator: "search",
      gsrsearch: requestedTopic,
      gsrlimit: "1",
      prop: "extracts",
      explaintext: "1",
      exintro: "1",
      origin: "*"
    });

    const res = await fetch(`${baseUrl}?${searchParams.toString()}`);
    if (!res.ok) throw new Error(`Wikipedia HTTP ${res.status}`);
    const json = await res.json();

    if (!json.query || !json.query.pages) {
      return JSON.stringify({
        result: JSON.stringify({status:"not_found", message:"Nie znaleziono tematu w polskiej Wikipedii."}),
        image: null,
        error: null
      });
    }

    const pages = json.query.pages;
    const page = pages[Object.keys(pages)[0]];
    const topic = page.title || requestedTopic;
    const extract = (page.extract || "").replace(/\s+/g, " ").trim();

    // Deterministyczne streszczenie bez drugiego wywołania modelu:
    // bierzemy maksymalnie pierwsze dwa zdania z leadu Wikipedii.
    const sentences = extract.match(/[^.!?]+[.!?]+/g) || [extract];
    let description = sentences.slice(0, 2).join(" ").trim();
    if (description.length > 320) {
      let cut = description.lastIndexOf(" ", 317);
      if (cut < 180) cut = 317;
      description = description.slice(0, cut).trim() + "...";
    }
    if (!description) description = "Brak krótkiego opisu w polskiej Wikipedii.";

    const canvas = document.getElementById("card-canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = 1080;
    canvas.height = 1080;

    const gradient = ctx.createLinearGradient(0,0,1080,1080);
    gradient.addColorStop(0,"#FF9A9E");
    gradient.addColorStop(0.5,"#FECFEF");
    gradient.addColorStop(1,"#A1C4FD");
    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,1080,1080);

    ctx.shadowColor = "rgba(0,0,0,0.15)";
    ctx.shadowBlur = 40;
    ctx.shadowOffsetY = 20;
    ctx.fillStyle = "#FFFFFF";

    const x=60,y=60,w=960,h=960,r=40;
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
    ctx.fill();
    ctx.shadowColor = "transparent";

    ctx.fillStyle = "#FF6B6B";
    ctx.font = 'bold 32px "Google Sans", sans-serif';
    ctx.fillText("💡 DZIŚ SIĘ DOWIEDZIAŁEM",120,150);

    ctx.fillStyle = "#2D3436";
    ctx.font = 'bold 72px "Google Sans", sans-serif';
    const nextY = wrapText(ctx, topic, 120, 250, 840, 85);

    ctx.fillStyle = "#636E72";
    ctx.font = '42px "Google Sans", sans-serif';
    wrapText(ctx, description, 120, nextY + 90, 840, 60);

    function getPlatform() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return "iOS";
      if (/android/i.test(ua)) return "Android";
      return "unknown";
    }

    let linkUrl = "https://github.com/google-ai-edge/gallery";
    const platform = getPlatform();
    if (platform === "iOS") linkUrl = "https://apps.apple.com/us/app/google-ai-edge-gallery/id6749645337";
    if (platform === "Android") linkUrl = "https://play.google.com/store/apps/details?id=com.google.ai.edge.gallery";

    const container = document.getElementById("qrcode-container");
    container.innerHTML = "";
    try {
      new QRCode(container, {
        text: linkUrl,
        width: 140,
        height: 140,
        colorDark: "#2D3436",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.L
      });
    } catch (_) {}

    const qrCanvas = await new Promise(resolve => {
      let tries = 0;
      const t = setInterval(() => {
        const c = container.querySelector("canvas");
        if (c) { clearInterval(t); resolve(c); }
        if (tries++ > 20) { clearInterval(t); resolve(null); }
      }, 50);
    });

    const footerY = 920;
    if (qrCanvas) ctx.drawImage(qrCanvas,830,820,140,140);

    const logoImg = new Image();
    logoImg.src = "../assets/galleryLogo.svg";
    await new Promise(resolve => {
      logoImg.onload = () => { ctx.drawImage(logoImg,115,footerY-30,70,70); resolve(); };
      logoImg.onerror = () => resolve();
    });

    ctx.fillStyle = "#2D3436";
    ctx.font = 'bold 36px "Google Sans", sans-serif';
    ctx.fillText("Google AI Edge Gallery",200,footerY);
    ctx.fillStyle = "#B2BEC3";
    ctx.font = '28px "Google Sans", sans-serif';
    ctx.fillText("Zeskanuj, aby pobrać aplikację",200,footerY+40);

    const finalBase64 = canvas.toDataURL("image/jpeg",0.9);

    return JSON.stringify({
      result: JSON.stringify({
        status:"success",
        topic,
        message:"Karta została wygenerowana."
      }),
      image:{base64:finalBase64},
      error:null
    });
  } catch (err) {
    return JSON.stringify({result:null,image:null,error:err.message});
  }
};

function wrapText(context,text,x,y,maxWidth,lineHeight) {
  const words=(text || "").split(" ");
  let line="";
  let currentY=y;
  for (let n=0;n<words.length;n++) {
    const testLine=line+words[n]+" ";
    if (context.measureText(testLine).width>maxWidth && n>0) {
      context.fillText(line,x,currentY);
      line=words[n]+" ";
      currentY+=lineHeight;
    } else {
      line=testLine;
    }
  }
  context.fillText(line,x,currentY);
  return currentY;
}
</script>
</body>
</html>
